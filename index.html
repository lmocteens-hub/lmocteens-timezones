<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LMOC Teens • Around The World</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🌌 GLOBAL BACKGROUND (FIXED + VISIBLE) */
body{
    margin:0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:#f5f5f5;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 20% 20%, rgba(90,130,180,0.35), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(170,120,200,0.25), transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(80,160,140,0.20), transparent 55%),
        linear-gradient(180deg,#070a10,#0c141d);

    padding:50px 20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

/* HERO */
.hero{
    text-align:center;
    margin-bottom:50px;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:5rem;
    letter-spacing:2px;
    color:#f5f1e8;
}

.hero .subtitle{
    font-size:1.6rem;
    color:#f0d5a0;
    font-style:italic;
}

.hero .description{
    margin-top:20px;
    color:#b7c0cb;
    font-size:1.05rem;
    line-height:1.7;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:28px;
}

/* CARD */
.card{
    background:rgba(21,27,34,0.92);
    border:1px solid #2a3440;
    border-radius:24px;
    padding:28px;
    backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:.25s ease;
}

.card:hover{
    transform:translateY(-4px);
}

/* LOCATION */
.location{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
}

.flag{font-size:2rem;}

.location h3{margin:0;font-size:1.2rem;}
.zone{color:#b7c0cb;font-size:.92rem;}

/* CLOCK */
.clock-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.clock{
    width:180px;
    height:180px;
    background:#f7f2e9;
    border-radius:50%;
    position:relative;
    border:8px solid #d9b26f;
    box-shadow:
        inset 0 0 12px rgba(0,0,0,.2),
        0 10px 20px rgba(0,0,0,.4);
}

/* ✅ FIXED NUMBER CENTERING */
.number{
    position:absolute;
    font-size:14px;
    font-weight:600;
    color:#222;
    transform:translate(-50%,-50%);
}

/* HANDS */
.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.hour{width:6px;height:50px;background:#111;border-radius:10px;}
.minute{width:4px;height:70px;background:#111;border-radius:10px;}
.second{width:2px;height:82px;background:#c98b2f;}

.center{
    width:12px;
    height:12px;
    background:#111;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* TEXT */
.digital{
    text-align:center;
    font-size:2rem;
    font-weight:600;
    color:#f0d5a0;
}

.date{
    text-align:center;
    margin-top:8px;
    color:#b7c0cb;
}

/* FOOTER */
.footer{
    margin-top:70px;
    text-align:center;
    color:#d8c8aa;
    font-size:1.1rem;
    font-style:italic;
}

.footer small{
    display:block;
    margin-top:10px;
    color:#b7c0cb;
    font-style:normal;
}

/* RESPONSIVE */
@media(max-width:700px){
.hero h1{font-size:3rem;}
.hero .subtitle{font-size:1.2rem;}
.clock{width:160px;height:160px;}
}

</style>
</head>

<body>

<div class="container">

<div class="hero">
    <h1>LMOC TEENS</h1>
    <div class="subtitle">Around the World</div>
    <div class="description">
        No matter where we live, we are connected in Christ as one global family.
    </div>
</div>

<div class="grid" id="grid"></div>

<div class="footer">
    "From every nation, tribe, people and language."
    <small>Revelation 7:9</small>
</div>

</div>

<script>

const zones = [
{flag:"🇺🇸",name:"Pacific Time",subtitle:"Washington",timezone:"America/Los_Angeles"},
{flag:"🇺🇸",name:"Central Time",subtitle:"United States",timezone:"America/Chicago"},
{flag:"🇺🇸",name:"Eastern Time",subtitle:"Tennessee",timezone:"America/New_York"},
{flag:"🇧🇷",name:"Brasília Time",subtitle:"Brazil",timezone:"America/Sao_Paulo"},
{flag:"🇹🇿",name:"East Africa Time",subtitle:"Tanzania",timezone:"Africa/Dar_es_Salaam"},
{flag:"🇩🇪🇫🇷",name:"Central European Time",subtitle:"Germany & France",timezone:"Europe/Berlin"}
];

const grid = document.getElementById("grid");

/* BUILD CLOCKS */
zones.forEach((zone,index)=>{
grid.innerHTML += `
<div class="card">

<div class="location">
<div class="flag">${zone.flag}</div>
<div>
<h3>${zone.name}</h3>
<div class="zone">${zone.subtitle}</div>
</div>
</div>

<div class="clock-wrap">
<div class="clock" id="clock-${index}">
<div class="hand hour" id="hour-${index}"></div>
<div class="hand minute" id="minute-${index}"></div>
<div class="hand second" id="second-${index}"></div>
<div class="center"></div>
</div>
</div>

<div class="digital" id="digital-${index}"></div>
<div class="date" id="date-${index}"></div>

</div>`;
});

/* 🔥 FIXED CLOCK NUMBER PLACEMENT */
document.querySelectorAll(".clock").forEach(clock=>{
for(let i=1;i<=12;i++){

const num=document.createElement("div");
num.className="number";

const angle=(i*30-90)*(Math.PI/180);
const radius=70;

/* correct center-based positioning */
const x = 50 + Math.cos(angle)*radius;
const y = 50 - Math.sin(angle)*radius;

num.style.left = `${x}%`;
num.style.top = `${y}%`;

num.textContent=i;

clock.appendChild(num);
}
});

/* CLOCK UPDATE */
function updateClocks(){

zones.forEach((zone,index)=>{

const now=new Date();

const formatter=new Intl.DateTimeFormat('en-US',{
timeZone:zone.timezone,
hour:'numeric',
minute:'numeric',
second:'numeric',
hour12:true
});

const parts=formatter.formatToParts(now);

const h=parseInt(parts.find(p=>p.type==="hour").value);
const m=parseInt(parts.find(p=>p.type==="minute").value);
const s=parseInt(parts.find(p=>p.type==="second").value);

const hourDeg=(h%12)*30+(m*0.5);
const minuteDeg=m*6;
const secondDeg=s*6;

document.getElementById(`hour-${index}`).style.transform=`translateX(-50%) rotate(${hourDeg}deg)`;
document.getElementById(`minute-${index}`).style.transform=`translateX(-50%) rotate(${minuteDeg}deg)`;
document.getElementById(`second-${index}`).style.transform=`translateX(-50%) rotate(${secondDeg}deg)`;

document.getElementById(`digital-${index}`).innerText =
new Date().toLocaleTimeString('en-US',{timeZone:zone.timezone});

document.getElementById(`date-${index}`).innerText =
new Date().toLocaleDateString('en-US',{
timeZone:zone.timezone,
weekday:'long',
month:'long',
day:'numeric'
});

});

}

updateClocks();
setInterval(updateClocks,1000);

</script>

</body>
</html>
