<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LMOC Teens • Around The World</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🌙 CLEAN DARK CANVAS (NO IMAGE) */
body{
    margin:0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:#f5f5f5;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 50% 20%, #1a2430 0%, #0b0f14 60%, #070a0f 100%);
}

/* 🌟 FAIRY LIGHT STRING (REAL ANIMATION NOW) */
.lights{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:120px;
    pointer-events:none;
    z-index:0;
}

.light{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255, 230, 170, 0.9);
    box-shadow:0 0 10px rgba(255,220,140,0.8);
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{opacity:0.3; transform:translateY(0px);}
    50%{opacity:1; transform:translateY(6px);}
}

/* LAYOUT */
.container{
    max-width:1400px;
    margin:auto;
    padding:18px 20px 50px 20px;
    position:relative;
    z-index:1;
}

/* HERO */
.hero{
    text-align:center;
    margin-bottom:20px;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:4rem;
    margin:0;
}

.hero .subtitle{
    font-size:1.2rem;
    margin-top:5px;
    color:#cfe3d6;
}

.hero .description{
    font-size:0.95rem;
    color:#b8c7bf;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:22px;
}

/* CARD */
.card{
    background:rgba(15,20,18,0.88);
    border:1px solid rgba(140,180,150,0.22);
    border-radius:22px;
    padding:20px;
}

/* CLOCK */
.clock{
    width:170px;
    height:170px;
    background:#f7f2e9;
    border-radius:50%;
    position:relative;
    margin:auto;
    border:7px solid #c8b48a;
}

/* NUMBERS */
.number{
    position:absolute;
    font-size:13px;
    font-weight:600;
    color:#222;
    transform:translate(-50%,-50%);
}

/* HANDS */
.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.hour{width:5px;height:45px;background:#111;}
.minute{width:4px;height:62px;background:#111;}
.second{width:2px;height:75px;background:#c98b2f;}

.center{
    width:10px;
    height:10px;
    background:#111;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* TEXT */
.digital{
    text-align:center;
    font-size:1.5rem;
    color:#e6d3a8;
}

.date{
    text-align:center;
    color:#bfcfc7;
    font-size:0.9rem;
}

/* CONVERTER */
.converter{
    margin-top:45px;
    padding:18px;
    border-radius:16px;
    background:rgba(15,20,18,0.72);
    border:1px solid rgba(140,180,150,0.2);
    text-align:center;
}

select{
    padding:7px 10px;
    border-radius:10px;
    border:none;
    background:#f7f2e9;
    font-weight:600;
}

.result{
    margin-top:10px;
    color:#c6d3c9;
}

/* FOOTER */
.footer{
    margin-top:50px;
    text-align:center;
    color:#e6d3a8;
    font-style:italic;
    font-size:0.95rem;
}

</style>
</head>

<body>

<!-- 🌟 FAIRY LIGHTS -->
<div class="lights" id="lights"></div>

<div class="container">

<div class="hero">
    <h1>LMOC TEENS</h1>
    <div class="subtitle">Around the World</div>
    <div class="description">One family across every time zone 🌍</div>
</div>

<div class="grid" id="grid"></div>

<div class="converter">
    <select id="from"></select>
    →
    <select id="to"></select>
    <div class="result" id="result"></div>
</div>

<div class="footer">
    "From every nation, tribe, people and language."
</div>

</div>

<script>

const zones = [
{flag:"🇺🇸",name:"Pacific",timezone:"America/Los_Angeles"},
{flag:"🇺🇸",name:"Central",timezone:"America/Chicago"},
{flag:"🇺🇸",name:"Eastern",timezone:"America/New_York"},
{flag:"🇧🇷",name:"Brazil",timezone:"America/Sao_Paulo"},
{flag:"🇹🇿",name:"East Africa",timezone:"Africa/Dar_es_Salaam"},
{flag:"🇩🇪",name:"Europe",timezone:"Europe/Berlin"}
];

/* 🌟 FAIRY LIGHT GENERATOR */
const lights=document.getElementById("lights");

for(let i=0;i<25;i++){
const d=document.createElement("div");
d.className="light";
d.style.left=Math.random()*100+"%";
d.style.top=Math.random()*100+"px";
d.style.animationDelay=Math.random()*3+"s";
d.style.opacity=Math.random();
lights.appendChild(d);
}

/* BUILD CLOCKS */
const grid=document.getElementById("grid");

zones.forEach((z,i)=>{
grid.innerHTML+=`
<div class="card">

<div class="clock" id="clock-${i}">
<div class="hand hour" id="h-${i}"></div>
<div class="hand minute" id="m-${i}"></div>
<div class="hand second" id="s-${i}"></div>
<div class="center"></div>
</div>

<div class="digital" id="d-${i}"></div>
<div class="date" id="date-${i}"></div>

</div>`;
});

/* NUMBERS */
function placeNumbers(){
document.querySelectorAll(".clock").forEach(clock=>{
const size=clock.clientWidth;
const c=size/2;
const r=c*0.78;

for(let i=1;i<=12;i++){
const n=document.createElement("div");
n.className="number";

const angle=((i-3)*30)*(Math.PI/180);

n.style.left=c+Math.cos(angle)*r+"px";
n.style.top=c+Math.sin(angle)*r+"px";

n.textContent=i;
clock.appendChild(n);
}
});
}

/* UPDATE */
function update(){
zones.forEach((z,i)=>{

const now=new Date();
const f=new Intl.DateTimeFormat('en-US',{
timeZone:z.timezone,
hour:'numeric',
minute:'numeric',
second:'numeric',
hour12:true
});

const p=f.formatToParts(now);

const h=+p.find(x=>x.type==="hour").value;
const m=+p.find(x=>x.type==="minute").value;
const s=+p.find(x=>x.type==="second").value;

document.getElementById(`h-${i}`).style.transform=`translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
document.getElementById(`m-${i}`).style.transform=`translateX(-50%) rotate(${m*6}deg)`;
document.getElementById(`s-${i}`).style.transform=`translateX(-50%) rotate(${s*6}deg)`;

document.getElementById(`d-${i}`).innerText=
new Date().toLocaleTimeString('en-US',{timeZone:z.timezone,hour:'numeric',minute:'2-digit',hour12:true});

document.getElementById(`date-${i}`).innerText=
new Date().toLocaleDateString('en-US',{timeZone:z.timezone,weekday:'long',month:'long',day:'numeric'});

});
}

/* INIT */
window.onload=()=>{
placeNumbers();
update();
};

setInterval(update,60000);

</script>

</body>
</html>
