<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LMOC Teens • Around The World</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🌿 BACKGROUND */
body{
    margin:0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:#f5f5f5;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 20% 20%, rgba(120,180,140,0.20), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(160,200,170,0.14), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(90,140,110,0.16), transparent 55%),
        linear-gradient(180deg,#070c09,#0d1611);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 30% 40%, rgba(255,255,255,0.02), transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,0.02), transparent 65%);
    pointer-events:none;
}

/* LAYOUT */
.container{
    max-width:1400px;
    margin:auto;
    padding:50px 20px;
}

/* HERO */
.hero{
    text-align:center;
    margin-bottom:50px;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:5rem;
    color:#f5f1e8;
}

.hero .subtitle{
    font-size:1.6rem;
    color:#d7e7d8;
    font-style:italic;
}

.hero .description{
    margin-top:20px;
    color:#b7c0cb;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:28px;
}

/* CARD */
.card{
    background:rgba(20,28,24,0.88);
    border:1px solid rgba(120,160,130,0.25);
    border-radius:24px;
    padding:28px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

/* LOCATION */
.location{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:22px;
}

.flag{font-size:2rem;}
.zone{color:#c6d3c9;font-size:.92rem;}

/* CLOCK */
.clock-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.clock{
    width:180px;
    height:180px;
    background:#f7f2e9;
    border-radius:50%;
    position:relative;
    border:8px solid #c8b48a;
    box-shadow:inset 0 0 12px rgba(0,0,0,.2), 0 10px 20px rgba(0,0,0,.4);
}

.number{
    position:absolute;
    font-size:14px;
    font-weight:600;
    color:#222;
    transform:translate(-50%,-50%);
}

.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.hour{width:6px;height:50px;background:#111;}
.minute{width:4px;height:70px;background:#111;}
.second{width:2px;height:82px;background:#c98b2f;}

.center{
    width:12px;
    height:12px;
    background:#111;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* TEXT */
.digital{
    text-align:center;
    font-size:1.8rem;
    color:#e6d3a8;
}

.date{
    text-align:center;
    color:#b7c0cb;
}

/* 🌍 CONVERTER */
.converter{
    margin-top:60px;
    padding:22px;
    border-radius:18px;
    background:rgba(20,28,24,0.65);
    border:1px solid rgba(120,160,130,0.25);
    text-align:center;
}

.converter-title{
    font-size:1.2rem;
    color:#e6d3a8;
    margin-bottom:12px;
}

.converter-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

select{
    padding:8px 10px;
    border-radius:10px;
    border:none;
    background:#f7f2e9;
    font-weight:600;
}

.result{
    margin-top:12px;
    color:#c6d3c9;
    line-height:1.6;
}

/* FOOTER */
.footer{
    margin-top:70px;
    text-align:center;
    color:#d8c8aa;
    font-style:italic;
}

</style>
</head>

<body>

<div class="container">

<div class="hero">
    <h1>LMOC TEENS</h1>
    <div class="subtitle">Around the World</div>
    <div class="description">One family, many time zones 🌍</div>
</div>

<div class="grid" id="grid"></div>

<!-- 🌍 CONVERTER -->
<div class="converter">
    <div class="converter-title">Quick Time Converter</div>

    <div class="converter-row">
        <select id="from"></select>
        <span>→</span>
        <select id="to"></select>
    </div>

    <div class="result" id="result"></div>
</div>

<div class="footer">
    "From every nation, tribe, people and language."
</div>

</div>

<script>

const zones = [
{flag:"🇺🇸",name:"Pacific",timezone:"America/Los_Angeles"},
{flag:"🇺🇸",name:"Central",timezone:"America/Chicago"},
{flag:"🇺🇸",name:"Eastern",timezone:"America/New_York"},
{flag:"🇧🇷",name:"Brazil",timezone:"America/Sao_Paulo"},
{flag:"🇹🇿",name:"East Africa",timezone:"Africa/Dar_es_Salaam"},
{flag:"🇩🇪",name:"Europe",timezone:"Europe/Berlin"}
];

/* BUILD CLOCKS */
const grid = document.getElementById("grid");

zones.forEach((z,i)=>{
grid.innerHTML += `
<div class="card">

<div class="location">
<div class="flag">${z.flag}</div>
<div>
<div>${z.name}</div>
<div class="zone">${z.timezone}</div>
</div>
</div>

<div class="clock-wrap">
<div class="clock" id="clock-${i}">
<div class="hand hour" id="h-${i}"></div>
<div class="hand minute" id="m-${i}"></div>
<div class="hand second" id="s-${i}"></div>
<div class="center"></div>
</div>
</div>

<div class="digital" id="d-${i}"></div>
<div class="date" id="date-${i}"></div>

</div>`;
});

/* CLOCK NUMBERS */
function placeNumbers(){
document.querySelectorAll(".clock").forEach(clock=>{
clock.querySelectorAll(".number").forEach(n=>n.remove());

const size = clock.clientWidth;
const center = size/2;
const r = center * 0.78;

for(let i=1;i<=12;i++){
const n=document.createElement("div");
n.className="number";

const angle=((i-3)*30)*(Math.PI/180);

n.style.left=center+Math.cos(angle)*r+"px";
n.style.top=center+Math.sin(angle)*r+"px";

n.textContent=i;
clock.appendChild(n);
}
});
}

/* CLOCKS */
function update(){
zones.forEach((z,i)=>{

const now=new Date();
const f=new Intl.DateTimeFormat('en-US',{
timeZone:z.timezone,
hour:'numeric',minute:'numeric',second:'numeric',hour12:true
});

const p=f.formatToParts(now);
const h=+p.find(x=>x.type==="hour").value;
const m=+p.find(x=>x.type==="minute").value;
const s=+p.find(x=>x.type==="second").value;

document.getElementById(`h-${i}`).style.transform=`translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
document.getElementById(`m-${i}`).style.transform=`translateX(-50%) rotate(${m*6}deg)`;
document.getElementById(`s-${i}`).style.transform=`translateX(-50%) rotate(${s*6}deg)`;

document.getElementById(`d-${i}`).innerText=
new Date().toLocaleTimeString('en-US',{timeZone:z.timezone});

document.getElementById(`date-${i}`).innerText=
new Date().toLocaleDateString('en-US',{timeZone:z.timezone,weekday:'long',month:'long',day:'numeric'});
});
}

/* CONVERTER */
function fill(){
const from=document.getElementById("from");
const to=document.getElementById("to");

zones.forEach((z,i)=>{
from.innerHTML+=`<option value="${i}">${z.flag} ${z.name}</option>`;
to.innerHTML+=`<option value="${i}">${z.flag} ${z.name}</option>`;
});

from.value=0;
to.value=4;
}

function convert(){
const f=zones[from.value];
const t=zones[to.value];

const now=new Date();

const ft=new Date(now.toLocaleString("en-US",{timeZone:f.timezone}));
const tt=new Date(now.toLocaleString("en-US",{timeZone:t.timezone}));

let diff=(tt-ft)/(1000*60*60);
if(diff>12) diff-=24;
if(diff<-12) diff+=24;

document.getElementById("result").innerHTML=`
<b>${f.flag} ${f.name}</b> → <b>${t.flag} ${t.name}</b><br>
Difference: ${diff>=0?"+":""}${diff.toFixed(1)} hours
`;
}

/* INIT */
window.onload=()=>{
placeNumbers();
update();
fill();
convert();
};

setInterval(()=>{
update();
convert();
},1000);

document.addEventListener("change",e=>{
if(e.target.id==="from"||e.target.id==="to") convert();
});

</script>

</body>
</html>
