<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LMOC Teens • Around The World</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🌙 CLEAN DARK BASE */
body{
    margin:0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:#f5f5f5;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 50% 20%, #1a2430 0%, #0b0f14 60%, #070a0f 100%);
}

/* ✨ SCATTERED FAIRY LIGHT FIELD (RETURNED + IMPROVED) */
.lights{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
}

.light{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:rgba(255, 235, 170, 0.9);
    box-shadow:0 0 12px rgba(255,220,140,0.75);
    animation: twinkle 4s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{
        opacity:0.25;
        transform:translateY(0px) scale(0.9);
    }
    50%{
        opacity:1;
        transform:translateY(-6px) scale(1.1);
    }
}

/* 🌿 LAYOUT (FIXED BREATHING ROOM) */
.container{
    max-width:1200px;
    margin:auto;
    padding:34px 20px 50px; /* 🔥 restored vertical space */
    position:relative;
    z-index:1;
}

/* 🌿 HERO (less scrunched, more presence) */
.hero{
    text-align:center;
    margin-bottom:28px;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:4.2rem; /* slightly bigger again */
    margin:0;
    letter-spacing:1px;
}

.hero .subtitle{
    font-size:1.35rem; /* restored readability */
    margin-top:6px;
    color:#cfe3d6;
}

.hero .description{
    font-size:1rem; /* slightly larger again */
    margin-top:10px;
    color:#b8c7bf;
}

/* 🌍 GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    gap:20px;
}

/* 🪵 CARD */
.card{
    background:rgba(15,20,18,0.88);
    border:1px solid rgba(140,180,150,0.20);
    border-radius:20px;
    padding:20px;
}

/* 🕰 CLOCK */
.clock{
    width:168px;
    height:168px;
    margin:auto;
    background:#f7f2e9;
    border-radius:50%;
    position:relative;
    border:6px solid #c8b48a;
    box-shadow:inset 0 0 10px rgba(0,0,0,.2);
}

/* NUMBERS */
.number{
    position:absolute;
    font-size:12.5px;
    font-weight:600;
    color:#222;
    transform:translate(-50%,-50%);
}

/* HANDS */
.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.hour{width:5px;height:44px;background:#111;}
.minute{width:4px;height:60px;background:#111;}
.second{width:2px;height:74px;background:#c98b2f;}

.center{
    width:10px;
    height:10px;
    background:#111;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* TEXT */
.digital{
    text-align:center;
    font-size:1.55rem;
    color:#e6d3a8;
    margin-top:10px;
}

.date{
    text-align:center;
    font-size:0.9rem;
    color:#bfcfc7;
}

/* CONVERTER */
.converter{
    margin-top:40px;
    padding:18px;
    border-radius:14px;
    background:rgba(15,20,18,0.72);
    border:1px solid rgba(140,180,150,0.18);
    text-align:center;
}

select{
    padding:8px 10px;
    border-radius:10px;
    border:none;
    background:#f7f2e9;
    font-weight:600;
}

.result{
    margin-top:10px;
    color:#c6d3c9;
}

/* FOOTER */
.footer{
    margin-top:50px;
    text-align:center;
    color:#e6d3a8;
    font-style:italic;
    font-size:0.95rem;
}

</style>
</head>

<body>

<!-- ✨ SCATTERED LIGHT FIELD -->
<div class="lights" id="lights"></div>

<div class="container">

<div class="hero">
    <h1>LMOC TEENS</h1>
    <div class="subtitle">Around the World</div>
    <div class="description">One family across every time zone 🌍</div>
</div>

<div class="grid" id="grid"></div>

<div class="converter">
    <select id="from"></select>
    →
    <select id="to"></select>
    <div class="result" id="result"></div>
</div>

<div class="footer">
    "From every nation, tribe, people and language."
</div>

</div>

<script>

const zones = [
{flag:"🇺🇸",name:"Pacific",timezone:"America/Los_Angeles"},
{flag:"🇺🇸",name:"Central",timezone:"America/Chicago"},
{flag:"🇺🇸",name:"Eastern",timezone:"America/New_York"},
{flag:"🇧🇷",name:"Brazil",timezone:"America/Sao_Paulo"},
{flag:"🇹🇿",name:"East Africa",timezone:"Africa/Dar_es_Salaam"},
{flag:"🇩🇪",name:"Europe",timezone:"Europe/Berlin"}
];

/* ✨ SCATTERED LIGHT GENERATION (BACK TO “AIRMOSPHERE”) */
const lights=document.getElementById("lights");

for(let i=0;i<45;i++){
const l=document.createElement("div");
l.className="light";

/* more natural scatter */
l.style.left=Math.random()*100+"%";
l.style.top=Math.random()*100+"%";

/* depth variation */
const scale=0.6 + Math.random()*1.4;
l.style.transform=`scale(${scale})`;

l.style.opacity=0.2 + Math.random()*0.8;

/* staggered animation */
l.style.animationDelay=Math.random()*4+"s";

lights.appendChild(l);
});

/* CLOCKS */
const grid=document.getElementById("grid");

zones.forEach((z,i)=>{
grid.innerHTML+=`
<div class="card">

<div class="clock" id="clock-${i}">
<div class="hand hour" id="h-${i}"></div>
<div class="hand minute" id="m-${i}"></div>
<div class="hand second" id="s-${i}"></div>
<div class="center"></div>
</div>

<div class="digital" id="d-${i}"></div>
<div class="date" id="date-${i}"></div>

</div>`;
});

/* NUMBERS */
function placeNumbers(){
document.querySelectorAll(".clock").forEach(clock=>{
const size=clock.clientWidth;
const c=size/2;
const r=c*0.78;

for(let i=1;i<=12;i++){
const n=document.createElement("div");
n.className="number";

const angle=((i-3)*30)*(Math.PI/180);

n.style.left=c+Math.cos(angle)*r+"px";
n.style.top=c+Math.sin(angle)*r+"px";

n.textContent=i;
clock.appendChild(n);
}
});
}

/* UPDATE */
function update(){
zones.forEach((z,i)=>{

const now=new Date();

const f=new Intl.DateTimeFormat('en-US',{
timeZone:z.timezone,
hour:'numeric',
minute:'numeric',
second:'numeric',
hour12:true
});

const p=f.formatToParts(now);

const h=+p.find(x=>x.type==="hour").value;
const m=+p.find(x=>x.type==="minute").value;
const s=+p.find(x=>x.type==="second").value;

document.getElementById(`h-${i}`).style.transform=`translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
document.getElementById(`m-${i}`).style.transform=`translateX(-50%) rotate(${m*6}deg)`;
document.getElementById(`s-${i}`).style.transform=`translateX(-50%) rotate(${s*6}deg)`;

document.getElementById(`d-${i}`).innerText =
new Date().toLocaleTimeString('en-US',{
timeZone:z.timezone,
hour:'numeric',
minute:'2-digit',
hour12:true
});

document.getElementById(`date-${i}`).innerText =
new Date().toLocaleDateString('en-US',{
timeZone:z.timezone,
weekday:'long',
month:'long',
day:'numeric'
});

});
}

/* INIT */
window.onload=()=>{
placeNumbers();
update();
};

setInterval(update,60000);

</script>

</body>
</html>
