<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LMOC Teens • Around The World</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🌙 DARK FOREST PATH BASE */
body{
    margin:0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:#f5f5f5;
    overflow-x:hidden;

    background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.75)),
        url("https://images.unsplash.com/photo-1501785888041-af3ef285b470");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

/* ✨ FAIRY LIGHT OVERLAY */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(circle at 20% 30%, rgba(255,220,140,0.10), transparent 40%),
        radial-gradient(circle at 40% 20%, rgba(255,240,180,0.08), transparent 45%),
        radial-gradient(circle at 70% 35%, rgba(255,210,120,0.09), transparent 42%),
        radial-gradient(circle at 85% 25%, rgba(255,230,160,0.07), transparent 40%),
        radial-gradient(circle at 60% 15%, rgba(255,255,255,0.04), transparent 50%);

    animation: glowDrift 10s ease-in-out infinite alternate;
}

@keyframes glowDrift{
    from{transform:translateY(0px);}
    to{transform:translateY(10px);}
}

/* 📦 LAYOUT (FIX TOP SPACING ISSUE) */
.container{
    max-width:1400px;
    margin:auto;
    padding:20px 20px 50px 20px; /* 🔥 reduced top padding */
}

/* 🌿 HERO (COMPACT) */
.hero{
    text-align:center;
    margin-bottom:25px; /* 🔥 reduced spacing */
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:4rem; /* slightly smaller = more elegant */
    margin:0;
    color:#f5f1e8;
}

.hero .subtitle{
    font-size:1.2rem;
    color:#d7e7d8;
    font-style:italic;
    margin-top:6px;
}

.hero .description{
    margin-top:10px;
    color:#c7d2cc;
    font-size:0.95rem;
}

/* 🌍 GRID (PULLED UP) */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:24px;
}

/* 🪵 CARD */
.card{
    background:rgba(15,20,18,0.88);
    border:1px solid rgba(140,180,150,0.22);
    border-radius:22px;
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
}

/* LOCATION */
.location{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.flag{font-size:1.8rem;}

.zone{
    color:#c6d3c9;
    font-size:.9rem;
}

/* 🕰 CLOCK */
.clock-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:14px;
}

.clock{
    width:170px;
    height:170px;
    background:#f7f2e9;
    border-radius:50%;
    position:relative;
    border:7px solid #c8b48a;
    box-shadow:
        inset 0 0 10px rgba(0,0,0,.2),
        0 8px 18px rgba(0,0,0,.4);
}

/* NUMBERS */
.number{
    position:absolute;
    font-size:13px;
    font-weight:600;
    color:#222;
    transform:translate(-50%,-50%);
}

/* HANDS */
.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.hour{width:5px;height:45px;background:#111;}
.minute{width:4px;height:62px;background:#111;}
.second{width:2px;height:75px;background:#c98b2f;}

.center{
    width:10px;
    height:10px;
    background:#111;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* TEXT */
.digital{
    text-align:center;
    font-size:1.6rem;
    color:#e6d3a8;
}

.date{
    text-align:center;
    color:#c7d2cc;
    font-size:0.9rem;
}

/* 🌍 CONVERTER */
.converter{
    margin-top:45px;
    padding:18px;
    border-radius:16px;
    background:rgba(15,20,18,0.7);
    border:1px solid rgba(140,180,150,0.2);
    text-align:center;
}

select{
    padding:7px 10px;
    border-radius:10px;
    border:none;
    background:#f7f2e9;
    font-weight:600;
}

.result{
    margin-top:10px;
    color:#c6d3c9;
}

/* FOOTER */
.footer{
    margin-top:50px;
    text-align:center;
    color:#e6d3a8;
    font-style:italic;
    font-size:0.95rem;
}

</style>
</head>

<body>

<div class="container">

<div class="hero">
    <h1>LMOC TEENS</h1>
    <div class="subtitle">Around the World</div>
    <div class="description">One family, many places, one God 🌍</div>
</div>

<div class="grid" id="grid"></div>

<div class="converter">
    <div class="converter-title">Quick Time Converter</div>

    <select id="from"></select>
    →
    <select id="to"></select>

    <div class="result" id="result"></div>
</div>

<div class="footer">
    "From every nation, tribe, people and language."
</div>

</div>

<script>

const zones = [
{flag:"🇺🇸",name:"Pacific",timezone:"America/Los_Angeles"},
{flag:"🇺🇸",name:"Central",timezone:"America/Chicago"},
{flag:"🇺🇸",name:"Eastern",timezone:"America/New_York"},
{flag:"🇧🇷",name:"Brazil",timezone:"America/Sao_Paulo"},
{flag:"🇹🇿",name:"East Africa",timezone:"Africa/Dar_es_Salaam"},
{flag:"🇩🇪",name:"Europe",timezone:"Europe/Berlin"}
];

const grid = document.getElementById("grid");

/* BUILD CLOCKS */
zones.forEach((z,i)=>{
grid.innerHTML += `
<div class="card">

<div class="location">
<div class="flag">${z.flag}</div>
<div>
<div>${z.name}</div>
<div class="zone">${z.timezone}</div>
</div>
</div>

<div class="clock-wrap">
<div class="clock" id="clock-${i}">
<div class="hand hour" id="h-${i}"></div>
<div class="hand minute" id="m-${i}"></div>
<div class="hand second" id="s-${i}"></div>
<div class="center"></div>
</div>
</div>

<div class="digital" id="d-${i}"></div>
<div class="date" id="date-${i}"></div>

</div>`;
});

/* CLOCK NUMBERS */
function placeNumbers(){
document.querySelectorAll(".clock").forEach(clock=>{
clock.querySelectorAll(".number").forEach(n=>n.remove());

const size = clock.clientWidth;
const center = size/2;
const r = center * 0.78;

for(let i=1;i<=12;i++){
const n=document.createElement("div");
n.className="number";

const angle=((i-3)*30)*(Math.PI/180);

n.style.left=center+Math.cos(angle)*r+"px";
n.style.top=center+Math.sin(angle)*r+"px";

n.textContent=i;
clock.appendChild(n);
}
});
}

/* CLOCK UPDATE */
function update(){
zones.forEach((z,i)=>{

const now=new Date();

const f=new Intl.DateTimeFormat('en-US',{
timeZone:z.timezone,
hour:'numeric',
minute:'numeric',
second:'numeric',
hour12:true
});

const p=f.formatToParts(now);

const h=+p.find(x=>x.type==="hour").value;
const m=+p.find(x=>x.type==="minute").value;
const s=+p.find(x=>x.type==="second").value;

document.getElementById(`h-${i}`).style.transform=`translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
document.getElementById(`m-${i}`).style.transform=`translateX(-50%) rotate(${m*6}deg)`;
document.getElementById(`s-${i}`).style.transform=`translateX(-50%) rotate(${s*6}deg)`;

document.getElementById(`d-${i}`).innerText =
new Date().toLocaleTimeString('en-US',{timeZone:z.timezone,hour:'numeric',minute:'2-digit',hour12:true});

document.getElementById(`date-${i}`).innerText =
new Date().toLocaleDateString('en-US',{timeZone:z.timezone,weekday:'long',month:'long',day:'numeric'});

});
}

/* CONVERTER */
function fill(){
const from=document.getElementById("from");
const to=document.getElementById("to");

zones.forEach((z,i)=>{
from.innerHTML+=`<option value="${i}">${z.flag} ${z.name}</option>`;
to.innerHTML+=`<option value="${i}">${z.flag} ${z.name}</option>`;
});

from.value=0;
to.value=4;
}

function convert(){
const f=zones[from.value];
const t=zones[to.value];

const now=new Date();

const ft=new Date(now.toLocaleString("en-US",{timeZone:f.timezone}));
const tt=new Date(now.toLocaleString("en-US",{timeZone:t.timezone}));

let diff=(tt-ft)/(1000*60*60);
if(diff>12) diff-=24;
if(diff<-12) diff+=24;

document.getElementById("result").innerHTML=
`${f.flag} ${f.name} → ${t.flag} ${t.name}<br>
<b>${diff>=0?"+":""}${diff.toFixed(1)} hrs</b>`;
}

window.onload=()=>{
placeNumbers();
update();
fill();
convert();
};

setInterval(()=>{
update();
convert();
},60000);

document.addEventListener("change",e=>{
if(e.target.id==="from"||e.target.id==="to") convert();
});

</script>

</body>
</html>
