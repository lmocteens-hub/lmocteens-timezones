<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LMOC Teens • Around The World</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* 🌙 CLEAN NIGHT BASE */
body{
    margin:0;
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:#f5f5f5;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 50% 20%, #1a2430 0%, #0b0f14 60%, #070a0f 100%);
}

/* ✨ STRING LIGHTS (MORE “HUNG” FEEL) */
.lights{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:140px;
    pointer-events:none;
    z-index:0;
}

.light{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:rgba(255, 235, 170, 0.9);
    box-shadow:0 0 12px rgba(255,220,140,0.7);
    animation: twinkle 4s infinite ease-in-out;
}

@keyframes twinkle{
    0%,100%{opacity:0.25; transform:translateY(0px);}
    50%{opacity:1; transform:translateY(6px);}
}

/* 🌿 LAYOUT */
.container{
    max-width:1200px;
    margin:auto;
    padding:16px 20px 40px;
    position:relative;
    z-index:1;
}

/* HERO (slightly tighter) */
.hero{
    text-align:center;
    margin-bottom:18px;
}

.hero h1{
    font-family:'Cormorant Garamond',serif;
    font-size:3.6rem;
    margin:0;
    letter-spacing:1px;
}

.hero .subtitle{
    font-size:1.1rem;
    margin-top:4px;
    color:#cfe3d6;
}

.hero .description{
    font-size:0.9rem;
    color:#b8c7bf;
    margin-top:6px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:18px;
}

/* CARD */
.card{
    background:rgba(15,20,18,0.88);
    border:1px solid rgba(140,180,150,0.20);
    border-radius:20px;
    padding:18px;
}

/* CLOCK */
.clock{
    width:165px;
    height:165px;
    margin:auto;
    background:#f7f2e9;
    border-radius:50%;
    position:relative;
    border:6px solid #c8b48a;
    box-shadow:inset 0 0 10px rgba(0,0,0,.2);
}

/* NUMBERS */
.number{
    position:absolute;
    font-size:12px;
    font-weight:600;
    color:#222;
    transform:translate(-50%,-50%);
}

/* HANDS */
.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
}

.hour{width:5px;height:42px;background:#111;}
.minute{width:4px;height:58px;background:#111;}
.second{width:2px;height:72px;background:#c98b2f;}

.center{
    width:10px;
    height:10px;
    background:#111;
    border-radius:50%;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* TEXT */
.digital{
    text-align:center;
    font-size:1.4rem;
    color:#e6d3a8;
    margin-top:8px;
}

.date{
    text-align:center;
    font-size:0.85rem;
    color:#bfcfc7;
}

/* CONVERTER FIXED */
.converter{
    margin-top:35px;
    padding:16px;
    border-radius:14px;
    background:rgba(15,20,18,0.72);
    border:1px solid rgba(140,180,150,0.18);
    text-align:center;
}

select{
    padding:7px 10px;
    border-radius:10px;
    border:none;
    background:#f7f2e9;
    font-weight:600;
}

.result{
    margin-top:10px;
    color:#c6d3c9;
    font-size:0.95rem;
}

/* FOOTER */
.footer{
    margin-top:40px;
    text-align:center;
    color:#e6d3a8;
    font-style:italic;
    font-size:0.9rem;
}

</style>
</head>

<body>

<!-- ✨ LIGHTS -->
<div class="lights" id="lights"></div>

<div class="container">

<div class="hero">
    <h1>LMOC TEENS</h1>
    <div class="subtitle">Around the World</div>
    <div class="description">One family across every time zone 🌍</div>
</div>

<div class="grid" id="grid"></div>

<div class="converter">
    <select id="from"></select>
    →
    <select id="to"></select>
    <div class="result" id="result"></div>
</div>

<div class="footer">
    "From every nation, tribe, people and language."
</div>

</div>

<script>

const zones = [
{flag:"🇺🇸",name:"Pacific",timezone:"America/Los_Angeles"},
{flag:"🇺🇸",name:"Central",timezone:"America/Chicago"},
{flag:"🇺🇸",name:"Eastern",timezone:"America/New_York"},
{flag:"🇧🇷",name:"Brazil",timezone:"America/Sao_Paulo"},
{flag:"🇹🇿",name:"East Africa",timezone:"Africa/Dar_es_Salaam"},
{flag:"🇩🇪",name:"Europe",timezone:"Europe/Berlin"}
];

/* ✨ LIGHTS (BETTER STRUCTURE) */
const lights=document.getElementById("lights");

for(let i=0;i<28;i++){
const l=document.createElement("div");
l.className="light";
l.style.left=(i*(100/28))+"%";
l.style.top=(Math.sin(i)*18 + 30)+"px";
l.style.animationDelay=(i*0.12)+"s";
lights.appendChild(l);
}

/* CLOCKS */
const grid=document.getElementById("grid");

zones.forEach((z,i)=>{
grid.innerHTML+=`
<div class="card">

<div class="clock" id="clock-${i}">
<div class="hand hour" id="h-${i}"></div>
<div class="hand minute" id="m-${i}"></div>
<div class="hand second" id="s-${i}"></div>
<div class="center"></div>
</div>

<div class="digital" id="d-${i}"></div>
<div class="date" id="date-${i}"></div>

</div>`;
});

/* NUMBERS */
function placeNumbers(){
document.querySelectorAll(".clock").forEach(clock=>{
const size=clock.clientWidth;
const c=size/2;
const r=c*0.78;

for(let i=1;i<=12;i++){
const n=document.createElement("div");
n.className="number";

const angle=((i-3)*30)*(Math.PI/180);

n.style.left=c+Math.cos(angle)*r+"px";
n.style.top=c+Math.sin(angle)*r+"px";

n.textContent=i;
clock.appendChild(n);
}
});
}

/* UPDATE CLOCKS */
function update(){
zones.forEach((z,i)=>{

const now=new Date();

const f=new Intl.DateTimeFormat('en-US',{
timeZone:z.timezone,
hour:'numeric',
minute:'numeric',
second:'numeric',
hour12:true
});

const p=f.formatToParts(now);

const h=+p.find(x=>x.type==="hour").value;
const m=+p.find(x=>x.type==="minute").value;
const s=+p.find(x=>x.type==="second").value;

document.getElementById(`h-${i}`).style.transform=`translateX(-50%) rotate(${(h%12)*30+m*0.5}deg)`;
document.getElementById(`m-${i}`).style.transform=`translateX(-50%) rotate(${m*6}deg)`;
document.getElementById(`s-${i}`).style.transform=`translateX(-50%) rotate(${s*6}deg)`;

document.getElementById(`d-${i}`).innerText =
new Date().toLocaleTimeString('en-US',{
timeZone:z.timezone,
hour:'numeric',
minute:'2-digit',
hour12:true
});

document.getElementById(`date-${i}`).innerText =
new Date().toLocaleDateString('en-US',{
timeZone:z.timezone,
weekday:'long',
month:'long',
day:'numeric'
});

});
}

/* CONVERTER FIX (THIS WAS THE BREAKPOINT) */
function initConverter(){
const from=document.getElementById("from");
const to=document.getElementById("to");

zones.forEach((z,i)=>{
from.innerHTML+=`<option value="${i}">${z.flag} ${z.name}</option>`;
to.innerHTML+=`<option value="${i}">${z.flag} ${z.name}</option>`;
});

from.value=0;
to.value=4;

function convert(){
const f=zones[from.value];
const t=zones[to.value];

const now=new Date();
const a=new Date(now.toLocaleString("en-US",{timeZone:f.timezone}));
const b=new Date(now.toLocaleString("en-US",{timeZone:t.timezone}));

let diff=(b-a)/(1000*60*60);
if(diff>12) diff-=24;
if(diff<-12) diff+=24;

document.getElementById("result").innerHTML=
`${f.flag} ${f.name} → ${t.flag} ${t.name} <br><b>${diff>=0?"+":""}${diff.toFixed(1)} hours</b>`;
}

from.addEventListener("change",convert);
to.addEventListener("change",convert);

convert();
}

/* INIT */
window.onload=()=>{
placeNumbers();
update();
initConverter();
};

setInterval(update,60000);

</script>

</body>
</html>
